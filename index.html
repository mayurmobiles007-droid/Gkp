<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>GKP AI</title>

<style>
:root{
  --vh:100dvh;
  --fs:clamp(14px,1.6vw + 11px,17px);
  --pad:clamp(12px,3vw,22px);
  --btn:clamp(44px,12vw,52px);
  --radius:clamp(0px,4vw,28px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{height:100%}

body{
  min-height:var(--vh);
  font-family:system-ui,Arial,sans-serif;
  font-size:var(--fs);
  color:white;
  background:
    radial-gradient(circle at 15% 15%,#6325b8 0,transparent 32%),
    radial-gradient(circle at 85% 80%,#006b82 0,transparent 30%),
    #070914;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}

.app{
  width:min(96%,900px);
  height:min(94vh,var(--vh));
  display:flex;
  flex-direction:column;
  background:rgba(12,16,32,.78);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
}

header{
  min-height:68px;
  padding:10px var(--pad);
  padding-top:max(10px,env(safe-area-inset-top));
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
  flex-shrink:0;
}

.logo{
  width:var(--btn);height:var(--btn);
  border-radius:30%;
  display:grid;place-items:center;
  font-size:calc(var(--btn) * .5);
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow:0 0 30px rgba(124,58,237,.4);
  margin-right:4px;
  flex-shrink:0;
}

.titleBox{min-width:0}
.title{font-size:1.3em;font-weight:800;white-space:nowrap}
.status{
  color:#8ff0b0;font-size:.78em;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.status.offline{color:#ffb86b}
.headerSpace{flex:1}

.hbtn{
  border:0;color:white;
  background:rgba(255,255,255,.08);
  width:44px;height:44px;
  border-radius:12px;
  cursor:pointer;
  font-size:1.1em;
  flex-shrink:0;
}
.hbtn:hover{background:rgba(255,255,255,.16)}

.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:var(--pad);
}

.row{display:flex;margin-bottom:14px}
.row.user{justify-content:flex-end}

.bubble{
  max-width:82%;
  padding:.8em 1.1em;
  border-radius:20px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:1em;
}

.bot .bubble{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-left-radius:5px;
}

.user .bubble{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  border-bottom-right-radius:5px;
}

.typing{
  color:#aaa;
  font-size:.88em;
  padding:0 var(--pad) 6px;
  min-height:24px;
  flex-shrink:0;
}

.composer{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px var(--pad);
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.1);
  background:rgba(10,13,27,.5);
  flex-shrink:0;
}

.input{
  min-width:0;
  flex:1;
  height:var(--btn);
  padding:0 16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  background:rgba(255,255,255,.07);
  color:white;
  font-size:16px; /* iPhone pe zoom band */
}
.input:focus{border-color:rgba(124,58,237,.7)}
.input::placeholder{color:#999}

.btn{
  width:var(--btn);height:var(--btn);
  border:0;border-radius:15px;
  color:white;cursor:pointer;
  font-size:1.2em;
  flex-shrink:0;
}
.voice{background:rgba(255,255,255,.08)}
.voice.listening{background:#dc2626;animation:pulse 1s infinite}
.send{background:linear-gradient(135deg,#7c3aed,#06b6d4)}
.send:disabled{opacity:.5;cursor:not-allowed}

@keyframes pulse{50%{opacity:.55}}

/* Phone: full screen */
@media(max-width:600px){
  .app{width:100%;height:var(--vh);border-radius:0;border:0}
  .bubble{max-width:90%}
}

/* Bahut chhote phone */
@media(max-width:360px){
  .composer{gap:6px}
  .logo{display:none}
  .title{font-size:1.15em}
}

/* Landscape / kam height */
@media(max-height:480px){
  header{min-height:52px;padding-top:6px;padding-bottom:6px}
  .logo{display:none}
  .app{height:var(--vh);border-radius:0}
}

/* Bade screen (tablet/laptop) */
@media(min-width:1000px){
  :root{--fs:17px}
  .app{width:min(92%,1000px)}
  .bubble{max-width:75%}
}
</style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">🤖</div>
    <div class="titleBox">
      <div class="title">GKP AI</div>
      <div class="status" id="status">● Personal AI Assistant</div>
    </div>
    <div class="headerSpace"></div>
    <button class="hbtn" id="muteBtn" onclick="toggleMute()" title="Voice reply on/off">🔊</button>
    <button class="hbtn" onclick="clearChat()" title="Chat delete karo">🗑️</button>
  </header>

  <div class="chat" id="chat"></div>
  <div class="typing" id="typing"></div>

  <div class="composer">
    <button class="btn voice" id="voiceBtn" onclick="voiceInput()">🎙️</button>
    <input class="input" id="input" type="text"
           placeholder="GKP AI se kuch pucho..." autocomplete="off">
    <button class="btn send" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
/*
 GKP AI - single page version
 API KEY yahan mat dalna. Key sirf backend (Render) me rakho.
*/

const BACKEND_URL = "https://gkp-hddi.onrender.com";
const REQUEST_TIMEOUT = 70000; // Render free server uthne me ~60s le sakta hai

/* ---------- Safe storage ---------- */

function loadStored(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){
    return fallback;
  }
}

function store(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

let history = loadStored("GKP_AI_HISTORY", []);
if(!Array.isArray(history)) history = [];

let muted = loadStored("GKP_AI_MUTED", false);
let busy = false;

/* ---------- Elements ---------- */

const chat    = document.getElementById("chat");
const input   = document.getElementById("input");
const typing  = document.getElementById("typing");
const sendBtn = document.getElementById("sendBtn");
const voiceBtn= document.getElementById("voiceBtn");
const muteBtn = document.getElementById("muteBtn");
const statusEl= document.getElementById("status");

/* ---------- Messages ---------- */

function saveHistory(){
  history = history.slice(-100); // storage bharne se bachao
  store("GKP_AI_HISTORY", history);
}

function addMessage(text, role, save = true){
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "bot");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;

  if(save){
    history.push({ role: role, content: text });
    saveHistory();
  }
}

function loadChat(){
  if(history.length === 0){
    addMessage(
`Namaste! 👋

Main GKP AI hoon.

Main aapka personal AI assistant hoon.

Aap mujhse Hindi, Hinglish ya English me baat kar sakte ho.`,
      "assistant", false);
  }else{
    history.forEach(m => addMessage(m.content, m.role, false));
  }
}

function showTyping(text){ typing.textContent = text || "GKP AI soch raha hai…"; }
function hideTyping(){ typing.textContent = ""; }

function setBusy(state){
  busy = state;
  sendBtn.disabled = state;
}

/* ---------- Fetch with timeout (AbortSignal ke bina, preview me bhi chalta hai) ---------- */

function fetchWithTimeout(url, options, ms){
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      const err = new Error("Server ne time par jawab nahi diya.");
      err.name = "TimeoutError";
      reject(err);
    }, ms);
    fetch(url, options).then(
      res => { clearTimeout(timer); resolve(res); },
      err => { clearTimeout(timer); reject(err); }
    );
  });
}

/* ---------- Server status / wake-up ---------- */

async function pingServer(){
  try{
    await fetchWithTimeout(BACKEND_URL + "/", { mode: "no-cors" }, REQUEST_TIMEOUT);
    statusEl.textContent = "● Personal AI Assistant";
    statusEl.classList.remove("offline");
  }catch(e){
    statusEl.textContent = "● Server uth raha hai…";
    statusEl.classList.add("offline");
  }
}

/* ---------- Send ---------- */

async function sendMessage(){
  if(busy) return;

  const message = input.value.trim();
  if(!message) return;

  // Pehle purani history lo (current message ke bina), warna backend ko message 2 baar milega
  const pastHistory = history.slice(-20);

  addMessage(message, "user");
  input.value = "";
  setBusy(true);
  showTyping();

  // Agar 6 sec se zyada lage to user ko batao
  const slowTimer = setTimeout(
    () => showTyping("Server jag raha hai, 1 minute tak lag sakta hai…"),
    6000
  );

  try{
    const response = await fetchWithTimeout(BACKEND_URL + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message, history: pastHistory })
    }, REQUEST_TIMEOUT);

    let data = {};
    try{ data = await response.json(); }catch(e){}

    if(!response.ok){
      throw new Error(data.error || ("Server error " + response.status));
    }

    if(!data.reply){
      throw new Error("Backend ne reply nahi bheja");
    }

    addMessage(data.reply, "assistant");
    speak(data.reply);

    statusEl.textContent = "● Personal AI Assistant";
    statusEl.classList.remove("offline");

  }catch(error){
    console.error(error);

    let reason = error.message || "Connection nahi ho paaya.";

    // Error screen par dikhao, par history me save mat karo
    addMessage(
`❌ GKP AI server se connection nahi ho paaya.

Karan: ${reason}

Dobara try karo. Agar baar baar ho to Render dashboard me backend check karo:
${BACKEND_URL}`,
      "assistant", false);

    statusEl.textContent = "● Server offline";
    statusEl.classList.add("offline");

  }finally{
    clearTimeout(slowTimer);
    hideTyping();
    setBusy(false);
    input.focus();
  }
}

/* ---------- Enter key ---------- */

input.addEventListener("keydown", function(event){
  if(event.key === "Enter" && !event.isComposing){
    event.preventDefault();
    sendMessage();
  }
});

/* ---------- Clear ---------- */

function clearChat(){
  if(!confirm("Kya aap puri chat delete karna chahte ho?")) return;

  history = [];
  try{ localStorage.removeItem("GKP_AI_HISTORY"); }catch(e){}
  if("speechSynthesis" in window) speechSynthesis.cancel();

  chat.innerHTML = "";
  addMessage(
`Chat clear ho gayi. 👋

Main GKP AI hoon.
Batao kya karna hai?`,
    "assistant", false);
}

/* ---------- Voice input ---------- */

let recognition = null;

function voiceInput(){
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!Recognition){
    alert("Aapke browser me voice input supported nahi hai. Chrome use karo.");
    return;
  }

  // Dobara dabane par band karo
  if(recognition){
    recognition.stop();
    return;
  }

  recognition = new Recognition();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => voiceBtn.classList.add("listening");

  recognition.onresult = function(event){
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function(event){
    if(event.error === "not-allowed" || event.error === "service-not-allowed"){
      alert("Microphone ki permission allow karo.");
    }else if(event.error !== "no-speech" && event.error !== "aborted"){
      alert("Voice input start nahi ho paya.");
    }
  };

  recognition.onend = function(){
    voiceBtn.classList.remove("listening");
    recognition = null;
  };

  try{
    recognition.start();
  }catch(e){
    recognition = null;
    voiceBtn.classList.remove("listening");
  }
}

/* ---------- Voice output ---------- */

function updateMuteBtn(){ muteBtn.textContent = muted ? "🔇" : "🔊"; }

function toggleMute(){
  muted = !muted;
  store("GKP_AI_MUTED", muted);
  if(muted && "speechSynthesis" in window) speechSynthesis.cancel();
  updateMuteBtn();
}

function speak(text){
  if(muted || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "hi-IN";
  speech.rate = 0.95;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}

/* ---------- Keyboard / screen size fix ---------- */

function fixHeight(){
  const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  document.documentElement.style.setProperty("--vh", h + "px");
  chat.scrollTop = chat.scrollHeight;
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fixHeight);
}
window.addEventListener("resize", fixHeight);
window.addEventListener("orientationchange", fixHeight);

/* ---------- Start ---------- */

fixHeight();

updateMuteBtn();
loadChat();
pingServer(); // page khulte hi Render server ko jagao
</script>

</body>
</html>
