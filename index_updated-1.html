<!DOCTYPE html>
<html>

    <link rel="stylesheet" href="styles.css" />

</html><!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GKP AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:system-ui,Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 15% 15%,#6325b8 0,transparent 32%),
    radial-gradient(circle at 85% 80%,#006b82 0,transparent 30%),
    #070914;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:96%;
  max-width:900px;
  height:94vh;
  display:flex;
  flex-direction:column;
  background:rgba(12,16,32,.78);
  backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
}

/* HEADER */

header{
  height:78px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
  width:50px;
  height:50px;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:25px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow:0 0 30px rgba(124,58,237,.4);
  margin-right:12px;
}

.title{
  font-size:20px;
  font-weight:800;
}

.status{
  color:#8ff0b0;
  font-size:12px;
  margin-top:2px;
}

.headerSpace{
  flex:1;
}

.clear{
  border:0;
  color:white;
  background:rgba(255,255,255,.08);
  padding:11px 13px;
  border-radius:12px;
  cursor:pointer;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:22px;
}

.row{
  display:flex;
  margin-bottom:16px;
}

.user{
  justify-content:flex-end;
}

.bubble{
  max-width:82%;
  padding:14px 17px;
  border-radius:20px;
  line-height:1.5;
  white-space:pre-wrap;
  font-size:15px;
}

.bot .bubble{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-left-radius:5px;
}

.user .bubble{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  border-bottom-right-radius:5px;
}

/* TYPING */

.typing{
  color:#aaa;
  font-size:14px;
  padding:0 20px 8px;
}

/* INPUT */

.composer{
  display:flex;
  gap:9px;
  padding:14px;
  border-top:1px solid rgba(255,255,255,.1);
  background:rgba(10,13,27,.5);
}

.input{
  min-width:0;
  flex:1;
  padding:15px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  background:rgba(255,255,255,.07);
  color:white;
  font-size:15px;
}

.input::placeholder{
  color:#999;
}

.btn{
  width:50px;
  height:50px;
  border:0;
  border-radius:15px;
  color:white;
  cursor:pointer;
  font-size:19px;
}

.voice{
  background:rgba(255,255,255,.08);
}

.send{
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
}

/* MOBILE */

@media(max-width:600px){

  .app{
    width:100%;
    height:100vh;
    border-radius:0;
  }

  .bubble{
    max-width:88%;
  }

  .chat{
    padding:17px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="logo">
    🤖
  </div>

  <div>
    <div class="title">GKP AI</div>
    <div class="status">● Personal AI Assistant</div>
  </div>

  <div class="headerSpace"></div>

  <button class="clear" onclick="clearChat()">
    🗑️
  </button>

</header>


<div class="chat" id="chat"></div>

<div class="typing" id="typing"></div>


<div class="composer">

  <button class="btn voice" onclick="voiceInput()">
    🎙️
  </button>

  <input
    class="input"
    id="input"
    type="text"
    placeholder="GKP AI se kuch pucho..."
    autocomplete="off"
  >

  <button
    class="btn send"
    onclick="sendMessage()"
  >
    ➤
  </button>

</div>

</div>


<script>

/*
====================================================
 GKP AI
 SINGLE PAGE VERSION
====================================================

 IMPORTANT:

 API KEY YAHAN MAT DALNA.

 Backend URL ko apne online backend se replace karo.

 Example:

 const BACKEND_URL =
 "https://gkp-ai-backend.onrender.com";

====================================================
*/

const BACKEND_URL =
"https://gkp-hddi.onrender.com";


/* MEMORY */

let history =
JSON.parse(
  localStorage.getItem("GKP_AI_HISTORY") || "[]"
);


/* ELEMENTS */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const typing =
document.getElementById("typing");


/* SAVE */

function saveHistory(){

  localStorage.setItem(
    "GKP_AI_HISTORY",
    JSON.stringify(history)
  );

}


/* ADD MESSAGE */

function addMessage(
  text,
  role,
  save=true
){

  const row =
  document.createElement("div");

  row.className =
  "row " +
  (role === "user" ? "user" : "bot");


  const bubble =
  document.createElement("div");

  bubble.className =
  "bubble";

  bubble.textContent =
  text;


  row.appendChild(bubble);

  chat.appendChild(row);


  chat.scrollTop =
  chat.scrollHeight;


  if(save){

    history.push({

      role:role,

      content:text

    });

    saveHistory();

  }

}


/* LOAD */

function loadChat(){

  if(history.length === 0){

    addMessage(

`Namaste! 👋

Main GKP AI hoon.

Main aapka personal AI assistant hoon.

Aap mujhse Hindi, Hinglish ya English me baat kar sakte ho.`,

      "assistant",

      false

    );

  }

  else{

    history.forEach(
      message => {

        addMessage(

          message.content,

          message.role,

          false

        );

      }
    );

  }

}


/* TYPING */

function showTyping(){

  typing.textContent =
  "GKP AI soch raha hai…";

}


function hideTyping(){

  typing.textContent = "";

}


/* SEND */

async function sendMessage(){

  const message =
  input.value.trim();


  if(!message)
    return;


  addMessage(
    message,
    "user"
  );


  input.value = "";

  showTyping();


  try{

    const response =
    await fetch(

      BACKEND_URL +
      "/api/chat",

      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          message:message,

          history:
          history.slice(-20)

        })

      }

    );


    const data =
    await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }


    hideTyping();


    addMessage(

      data.reply,

      "assistant"

    );


    speak(data.reply);


  }

  catch(error){

    hideTyping();


    addMessage(

`❌ GKP AI server se connection nahi ho paaya.

Backend URL check karo:

${BACKEND_URL}`,

      "assistant"

    );

    console.error(error);

  }

}


/* ENTER KEY */

input.addEventListener(

  "keydown",

  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }

);


/* CLEAR CHAT */

function clearChat(){

  if(
    !confirm(
      "Kya aap puri chat delete karna chahte ho?"
    )
  )
    return;


  history = [];

  localStorage.removeItem(
    "GKP_AI_HISTORY"
  );


  chat.innerHTML = "";


  addMessage(

`Chat clear ho gayi. 👋

Main GKP AI hoon.
Batao kya karna hai?`,

    "assistant",

    false

  );

}


/* VOICE INPUT */

function voiceInput(){

  const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


  if(!Recognition){

    alert(
      "Aapke browser me voice input supported nahi hai."
    );

    return;

  }


  const recognition =
  new Recognition();


  recognition.lang =
  "hi-IN";


  recognition.interimResults =
  false;


  recognition.start();


  recognition.onresult =
  function(event){

    input.value =
    event.results[0][0].transcript;

    sendMessage();

  };


  recognition.onerror =
  function(){

    alert(
      "Voice input start nahi ho paya."
    );

  };

}


/* VOICE OUTPUT */

function speak(text){

  if(
    !("speechSynthesis" in window)
  )
    return;


  speechSynthesis.cancel();


  const speech =
  new SpeechSynthesisUtterance(
    text
  );


  speech.lang =
  "hi-IN";


  speech.rate =
  0.95;


  speech.pitch =
  1;


  speechSynthesis.speak(
    speech
  );

}


/* START */

loadChat();

</script>

</body>
</html>
